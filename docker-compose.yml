services:
  frigate-guardian:
    build: .
    container_name: frigate-guardian
    restart: always
    network_mode: host
    privileged: true
    environment:
      - PORT=8100
      - DATA_DIR=/app/data
      - NODE_ENV=production
      # - GEMINI_API_KEY=your-api-key-here
    volumes:
      # Persist configuration data
      - guardian_data:/app/data
    env_file:
      - .env
      - guardian.env

volumes:
  guardian_data:
